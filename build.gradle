import groovy.json.JsonSlurper

// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.kotlin_version = '2.2.10'
    repositories {
        mavenCentral()
        google()
        maven { url "https://maven.aliyun.com/repository/central" }
        maven { url "https://maven.aliyun.com/repository/google" }
        maven { url "https://maven.aliyun.com/repository/gradle-plugin" }
        maven { url "https://maven.aliyun.com/repository/public" }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        // classpath 'com.jakewharton:butterknife-gradle-plugin:10.2.3'  // Disabled - incompatible with AGP 9.x
        classpath 'org.codehaus.groovy:groovy-json:3.0.8'
        classpath 'org.codehaus.groovy:groovy-xml:3.0.8'
    }
}

allprojects {
    configurations.all {
        resolutionStrategy {
            force 'org.codehaus.groovy:groovy-json:3.0.8'
            force 'org.codehaus.groovy:groovy-xml:3.0.8'
        }
    }
    
    repositories {
        mavenCentral()
        google()
        maven { url "https://jitpack.io" }
        maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
        maven { url "https://maven.aliyun.com/repository/central" }
        maven { url "https://maven.aliyun.com/repository/google" }
        maven { url "https://maven.aliyun.com/repository/gradle-plugin" }
        maven { url "https://maven.aliyun.com/repository/public" }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

ext {
    versions = new JsonSlurper().parse(file('./project-versions.json'))
    ext.junit_version = '4.13.2'
    ext.appcompat_version = '1.7.0'
    ext.material_version = '1.12.0'
    ext.coroutines_version = '1.9.0'
}
