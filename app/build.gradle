import java.text.SimpleDateFormat

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
// AndroidAnnotations removed - migrated to ViewBinding
def SupportLibVersion = '28.0.0'
def homePath = System.properties['user.home']
def storePasswd = System.getenv('ccapasswd')
def keyPasswd = System.getenv('ccapasswd')
def alias = System.getenv('ccaalias')
def buglyAppId = System.getenv("bugly_app_id")
def posthogAppId = System.getenv("posthog_app_id")

def signSupport = false

android {
    namespace "net.cc.cca"
    buildFeatures {
        buildConfig true
    }
    signingConfigs {
        if (file(homePath + '/auto-js-t-pkcs12.jks').exists()) {
            signSupport = true
            release {
                storeFile file(homePath + '/auto-js-t-pkcs12.jks')
                storePassword storePasswd
                keyPassword keyPasswd
                keyAlias = alias
            }
        }
        debug {
            storeFile file('debug/autojs-pkcs12-debug.jks')
            storePassword 'fixture'
            keyPassword 'fixture'
            keyAlias = 'autojs-debug'
        }
    }
    compileSdkVersion versions.compile
    defaultConfig {
        applicationId "net.cc.cca"
        minSdkVersion versions.mini
        targetSdkVersion versions.target
        versionCode versions.appVersionCode
        versionName versions.appVersionName
        buildConfigField "String", "BUGLY_APP_ID", "\"${buglyAppId ?: ''}\""
        buildConfigField "String", "POSTHOG_APP_ID", "\"${posthogAppId ?: ''}\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
        ndk { }
    }
    
    buildFeatures {
        viewBinding = true
    }
    
    buildTypes {
        debug {
            shrinkResources false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
            applicationIdSuffix ".debug"
        }
        release {
            debuggable false
            shrinkResources false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            applicationIdSuffix ".modify"
            if (signSupport) {
                println('sign support')
                signingConfig signingConfigs.release
            } else {
                println('sign is not support')
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        encoding = 'utf-8'
    }
    
    kotlinOptions {
        jvmTarget = '1.8'
    }

    configurations.all {
        resolutionStrategy.force 'com.google.code.findbugs:jsr305:3.0.1'
        
        // Exclude all old support libraries to avoid conflicts with AndroidX
        // Projects using old support libs should migrate to AndroidX
        exclude group: 'com.android.support', module: 'appcompat-v7'
        exclude group: 'com.android.support', module: 'support-v4'
        exclude group: 'com.android.support', module: 'support-compat'
        exclude group: 'com.android.support', module: 'support-core-ui'
        exclude group: 'com.android.support', module: 'support-core-utils'
        exclude group: 'com.android.support', module: 'support-media-compat'
        exclude group: 'com.android.support', module: 'support-fragment'
        exclude group: 'com.android.support', module: 'animated-vector-drawable'
        exclude group: 'com.android.support', module: 'support-vector-drawable'
        exclude group: 'com.android.support', module: 'recyclerview-v7'
        exclude group: 'com.android.support', module: 'design'
    }

    splits {

        // Configures multiple APKs based on ABI.
        abi {

            // Enables building multiple APKs per ABI.
            enable true

            // By default all ABIs are included, so use reset() and include to specify that we only
            // want APKs for x86 and x86_64.

            // Resets the list of ABIs that Gradle should create APKs for to none.
            reset()

            // Specifies a list of ABIs that Gradle should create APKs for.
            include "x86", "x86_64", "armeabi-v7a", "arm64-v8a"
//            include "x86", "armeabi-v7a"

            // Specifies that we do not want to also generate a universal APK that includes all ABIs.
            universalApk false
        }
    }
    lint {
        abortOnError false
        disable 'MissingTranslation', 'ExtraTranslation'
    }
}
def copyRelease(abi) {
    copy {
        def fromFile = file('./build/outputs/apk/release')
        def intoFile = file('../common/release')
        println 'copy release apk ' + abi + ' from ' + fromFile + ' into ' + intoFile
        from fromFile
        into intoFile
        def fileName = 'app-' + abi + '-release.apk'
        include fileName
        SimpleDateFormat sdf = new SimpleDateFormat("yyyyMMdd")
        def currentDate = sdf.format(new Date())
        rename fileName, versions.patchName + '.' + abi + '.' + currentDate + '.apk'
    }
}


task copyReleaseApk {
    doLast {
        copyRelease('armeabi-v7a')
        copyRelease('arm64-v8a')
    }
}

tasks.whenTaskAdded { task ->
    if (task.name == 'assembleRelease') {
        task.finalizedBy 'copyReleaseApk'
    }
}

repositories {
    google()
}

