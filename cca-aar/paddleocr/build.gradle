plugins {
    id 'com.android.library'
}
import java.security.MessageDigest

android {
    namespace "net.cc.cca.paddleocr"
    compileSdk 34
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 21

        // Removed externalNativeBuild - ONNX Runtime is pre-compiled
        /*
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++11 -frtti -fexceptions -Wno-format"
                arguments '-DANDROID_PLATFORM=android-23', '-DANDROID_STL=c++_shared' ,"-DANDROID_ARM_NEON=TRUE"
            }
        }
        */
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
            ldLibs "jnigraphics"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    // Removed externalNativeBuild - ONNX Runtime is pre-compiled
    // If you need custom C++ code, uncomment this:
    /*
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
    */
    lint {
        targetSdk 34
    }
    testOptions {
        targetSdk 34
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation project(path: ':cca-aar:opencv')
    implementation project(path: ':cca-aar:opencvhelper')
    
    // RapidOCR: Replace PaddleLite with ONNX Runtime
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.19.2'
}

/**
 * RapidOCR 模型下载配置
 * 使用 ONNX Runtime 替代 PaddleLite,解决 NDK 26+ 兼容性问题
 * 
 * ⚠️ IMPORTANT: Manual model download required!
 * 
 * Download models from one of these sources:
 * 1. Baidu Pan (Recommended): https://pan.baidu.com/secret/YOUR_SECRET_KEY  (check RapidOCR README)
 * 2. Google Drive: Check RapidOCR GitHub for links
 * 3. HuggingFace: https://huggingface.co/RapidAI (requires login)
 * 
 * PP-OCRv3 Model List:
 * - ch_PP-OCRv3_det_infer.onnx  (Detection model)
 * - ch_PP-OCRv3_rec_infer.onnx  (Recognition model)  
 * - ch_ppocr_mobile_v2.0_cls_infer.onnx  (Classification model, optional)
 * 
 * Place downloaded models in: cca-aar/paddleocr/models/
 */
def modelArchives = [] // Empty - manual download required
/**
 * 下载opencv4.8.0源码包 默认为4.2.0 和 AutoJS中的版本不匹配会产生冲突 这里进行修改
 */
def zipArchives = [
    [
        'src' : 'https://github.com/opencv/opencv/releases/download/4.8.0/opencv-4.8.0-android-sdk.zip',
        'dest': 'OpenCV'
    ]
]

/**
 * 首次导入最好手动运行一下这个task下载依赖的包
 */
task downloadAndExtractArchives(type: DefaultTask) {
    doFirst {
        println "Downloading and extracting archives including libs and models"
    }
    doLast {
        // Prepare cache folder for archives
        String cachePath = "cache"
        if (!file("${cachePath}").exists()) {
            mkdir "${cachePath}"
        }
        modelArchives.eachWithIndex { archive, index ->
            MessageDigest messageDigest = MessageDigest.getInstance('MD5')
            messageDigest.update(archive.src.bytes)
            String cacheName = new BigInteger(1, messageDigest.digest()).toString(32)
            // Download the target archive if not exists
            boolean copyFiles = !file("${archive.dest}").exists()
            if (!file("${cachePath}/${cacheName}.onnx").exists()) {
                ant.get(src: archive.src, dest: file("${cachePath}/${cacheName}.onnx"))
            }
            // Copy model to assets or models directory
            File destFile = file(archive.dest)
            if (!destFile.exists()) {
                destFile.parentFile.mkdirs()
                copy {
                    from "${cachePath}/${cacheName}.onnx"
                    into archive.dest.replace('/${archive.dest.substring(archive.lastIndexOf('/') + 1)}', '')
                }
            }
        }
        zipArchives.eachWithIndex { archive, index ->
            MessageDigest messageDigest = MessageDigest.getInstance('MD5')
            messageDigest.update(archive.src.bytes)
            String cacheName = new BigInteger(1, messageDigest.digest()).toString(32)
            // Download the target archive if not exists
            boolean copyFiles = !file("${archive.dest}").exists()
            if (!file("${cachePath}/${cacheName}.zip").exists()) {
                ant.get(src: archive.src, dest: file("${cachePath}/${cacheName}.zip"))
                copyFiles = true; // force to copy files from the latest archive files
            }
            // Extract the target archive if its dest path does not exists
            if (copyFiles) {
                copy {
                    from zipTree("${cachePath}/${cacheName}.zip")
                    into "${archive.dest}"
                }
            }
        }
    }
}
preBuild.dependsOn downloadAndExtractArchives